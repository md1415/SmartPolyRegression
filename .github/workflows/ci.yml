name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]
      fail-fast: false  # اجازه بده همه نسخه‌ها تست بشن حتی اگه یکی fail شد

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy scikit-learn matplotlib pytest
        # requirements.txt رو سعی کن نصب کنی اگه باشه
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Run tests
      run: |
        pytest tests/ -v --tb=short
    
    - name: Test demo script
      run: |
        python examples/demo.py

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install linters
      run: |
        pip install flake8
    
    - name: Run flake8
      run: |
        flake8 src/ --max-line-length=120 --ignore=E402,W503

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: always() && needs.test.result == 'success' && needs.lint.result == 'success'
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Build package
      run: |
        python -m pip install --upgrade pip
        python -m pip install build
        python -m build --wheel
    
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: smart-regression-wheel
        path: dist/*.whl