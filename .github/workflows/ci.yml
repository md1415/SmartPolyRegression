name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
      fail-fast: false

    steps:
    - uses: actions/checkout@v4  # Updated from v3 to v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5  # Updated from v4 to v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "numpy<2.0" scikit-learn matplotlib pytest
    
    - name: Run tests
      run: |
        pytest tests/ -v -x

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4  # Updated
    - name: Set up Python
      uses: actions/setup-python@v5  # Updated
      with:
        python-version: '3.10'
    
    - name: Install linters
      run: |
        pip install flake8
    
    - name: Run flake8
      run: |
        flake8 src/ --max-line-length=120 --ignore=E402,W503

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: success()
    steps:
    - uses: actions/checkout@v4  # Updated
    - name: Set up Python
      uses: actions/setup-python@v5  # Updated
      with:
        python-version: '3.10'
    
    - name: Build package
      run: |
        python -m pip install --upgrade pip
        pip install build
        python -m build --wheel