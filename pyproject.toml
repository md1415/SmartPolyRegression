[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-regression"
version = "1.0.0"
description = "Automated polynomial regression with intelligent degree selection"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Mehrshad Mahmoudi", email = "your-email@example.com"}
]
dependencies = [
    "numpy>=1.19.0",
    "scikit-learn>=0.24.0",
    "matplotlib>=3.3.0"
]

[project.optional-dependencies]
dev = ["pytest>=6.0.0", "flake8>=4.0.0"]

[tool.setuptools.packages.find]
where = ["src"]